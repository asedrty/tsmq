name: Turn Scan (Runner Engine)

on:
  workflow_dispatch:
    inputs:
      shards_preset:
        description: '分片机器预设选择'
        required: true
        type: choice
        options:
          - '4 台机器 (默认稳妥，推荐 50 万以下)'
          - '8 台机器 (极速并发，推荐 50 万以上)'
          - 'custom (使用下方自定义输入)'
        default: 'custom (使用下方自定义输入)'
      custom_shards:
        description: '自定义分片机器数 (选 custom 时生效，范围 1~20)'
        required: false
        default: '20'
      auth_mode:
        description: '认证探测模式'
        required: true
        type: choice
        options:
          - 'DICT (弱口令字典爆破)'
          - 'NO_AUTH (纯免密极速跳过)'
        default: 'DICT (弱口令字典爆破)'
      ports:
        description: '默认扫描端口 (逗号分隔，5349默认TLS，3478/3479明文)'
        required: false
        default: '3478,5349'
      concur:
        description: '深度验证并发数 (-c)'
        required: false
        default: '500'
      ping_concur:
        description: 'TCPing 快速预筛并发数 (-p)'
        required: false
        default: '3000'
      ping_timeout:
        description: 'TCPing 超时秒数 (-pt，支持小数)'
        required: false
        default: '3'
      save_mode:
        description: '结果写回私库策略'
        required: true
        type: choice
        options:
          - 'merge (与历史结果合并去重)'
          - 'overwrite (覆盖为本次最新结果)'
        default: 'merge (与历史结果合并去重)'

permissions:
  contents: read
  actions: write

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.calc-matrix.outputs.matrix }}
      total_shards: ${{ steps.calc-matrix.outputs.total_shards }}

    steps:
      - name: Calculate Shard Matrix
        id: calc-matrix
        env:
          INPUT_PRESET: ${{ github.event.inputs.shards_preset }}
          INPUT_CUSTOM: ${{ github.event.inputs.custom_shards }}
        run: |
          python3 - <<'EOF'
          import json
          import os

          preset = os.environ.get("INPUT_PRESET", "")
          custom = os.environ.get("INPUT_CUSTOM", "4").strip()

          if "8" in preset:
              shards = 8
          elif "custom" in preset:
              try:
                  shards = int(custom)
              except ValueError:
                  shards = 4
          else:
              shards = 4

          shards = max(1, min(20, shards))
          shard_list = list(range(shards))
          print(f"[*] 选定分片数量: {shards} 台机器")
          print(f"[*] 分片矩阵: {shard_list}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(shard_list)}\n")
              f.write(f"total_shards={shards}\n")
          EOF

  scan-matrix:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Checkout Private Repository
        env:
          MY_PAT: ${{ secrets.MY_PAT }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
        run: |
          if [ -z "$MY_PAT" ] || [ -z "$PRIVATE_REPO" ]; then
            echo "❌ 错误: 必须在公开仓库 Settings -> Secrets 中配置 MY_PAT 与 PRIVATE_REPO！"
            exit 1
          fi
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$MY_PAT" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" clone --depth 1 "https://github.com/${PRIVATE_REPO}.git" private_vault
          cp private_vault/turn_scan.go ./
          cp private_vault/ip.txt ./
          [ -f private_vault/go.mod ] && cp private_vault/go.mod ./ || go mod init turnscan
          [ -f private_vault/dict.txt ] && cp private_vault/dict.txt ./ || true
          rm -rf private_vault

      - name: Build and Run Turn Shard Scanner
        env:
          VERIFY_API_KEY: ${{ secrets.VERIFY_API_KEY }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ needs.generate-matrix.outputs.total_shards }}
          INPUT_AUTH_MODE: ${{ github.event.inputs.auth_mode }}
          INPUT_PORTS: ${{ github.event.inputs.ports }}
          INPUT_CONCUR: ${{ github.event.inputs.concur }}
          INPUT_PING_CONCUR: ${{ github.event.inputs.ping_concur }}
          INPUT_PING_TIMEOUT: ${{ github.event.inputs.ping_timeout }}
        run: |
          PORTS=$(printf '%s' "$INPUT_PORTS" | tr -d '[:space:]')
          [ -z "$PORTS" ] && PORTS="3478,5349"
          CONCUR=$(printf '%s' "$INPUT_CONCUR" | tr -d '[:space:]')
          [ -z "$CONCUR" ] && CONCUR="100"
          PING_CONCUR=$(printf '%s' "$INPUT_PING_CONCUR" | tr -d '[:space:]')
          [ -z "$PING_CONCUR" ] && PING_CONCUR="500"
          PING_TIMEOUT=$(printf '%s' "$INPUT_PING_TIMEOUT" | tr -d '[:space:]')
          [ -z "$PING_TIMEOUT" ] && PING_TIMEOUT="1.5"

          EXTRA_ARGS=("-quiet-hits")
          if [[ "$INPUT_AUTH_MODE" == NO_AUTH* ]]; then
            EXTRA_ARGS+=("-noauth-only")
          elif [ -s "dict.txt" ]; then
            EXTRA_ARGS+=("-dict" "dict.txt")
          fi

          # 先编译为独立二进制，确保 timeout 发送 SIGTERM 时能直接触达引擎完成优雅刷盘
          go build -o turn_scan turn_scan.go

          set +e
          timeout -s TERM 330m ./turn_scan \
            "${EXTRA_ARGS[@]}" \
            -shard-index "$SHARD_INDEX" \
            -shard-total "$SHARD_TOTAL" \
            -ports "$PORTS" \
            -c "$CONCUR" \
            -p "$PING_CONCUR" \
            -pt "$PING_TIMEOUT" \
            -output "results_${SHARD_INDEX}.txt" \
            -input ip.txt
          rc=$?
          set -e

          # 0=正常扫完, 124=330分钟优雅停机保底导出
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "[!] 扫描进程异常退出 (exit=$rc)"
            exit "$rc"
          fi

      - name: Upload Shard Result Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "shard-${{ matrix.shard }}"
          path: "results_${{ matrix.shard }}.txt"
          if-no-files-found: ignore
          retention-days: 1

  merge-and-push:
    needs: [generate-matrix, scan-matrix]
    if: always() && needs.generate-matrix.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: shards

      - name: Merge and deduplicate results
        id: merge
        run: |
          echo "[*] 开始汇总并去重所有分片结果..."
          mkdir -p temp_merge
          find shards -type f -name "results_*.txt" -exec cat {} + > temp_merge/raw_results.txt 2>/dev/null || true

          TOTAL_LINES=$(grep -v '^\s*$' temp_merge/raw_results.txt 2>/dev/null | wc -l || echo 0)
          echo "[*] 成功收集到的各分片存活行数: $TOTAL_LINES"

          if [ "$TOTAL_LINES" -gt 0 ]; then
            grep -v '^\s*$' temp_merge/raw_results.txt | sort -u > turn_results.txt
            ALIVE_COUNT=$(wc -l < turn_results.txt)
            echo "[+] 本次扫描收集到存活 TURN: $ALIVE_COUNT"
            echo "has_alive=true" >> "$GITHUB_OUTPUT"
            echo "count=$ALIVE_COUNT" >> "$GITHUB_OUTPUT"
          else
            echo "[-] 本次收集到的存活数为 0，不执行更新！"
            echo "has_alive=false" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Get current date
        id: date
        run: |
          echo "date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Push results back to Private Repository
        if: steps.merge.outputs.has_alive == 'true'
        env:
          MY_PAT: ${{ secrets.MY_PAT }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          SAVE_MODE: ${{ github.event.inputs.save_mode }}
          CUR_DATE: ${{ steps.date.outputs.date }}
        run: |
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$MY_PAT" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" clone --depth 1 "https://github.com/${PRIVATE_REPO}.git" target_repo

          cd target_repo
          CUR_BRANCH=$(git symbolic-ref --short HEAD)
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          merge_results() {
            if [[ "$SAVE_MODE" == merge* ]] && [ -f turn_results.txt ]; then
              cat ../turn_results.txt turn_results.txt | grep -v '^\s*$' | sort -u > turn_results_merged.txt
              mv turn_results_merged.txt turn_results.txt
            else
              cp ../turn_results.txt turn_results.txt
            fi
          }

          merge_results
          git add turn_results.txt
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update turn_results.txt (${CUR_DATE}) [skip ci]"
            if ! git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push origin "HEAD:${CUR_BRANCH}"; then
              echo "[*] 检测到私库远端有并发更新，重新拉取合并后再推送..."
              git reset --hard "origin/${CUR_BRANCH}"
              git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" pull --ff-only origin "${CUR_BRANCH}"
              merge_results
              git add turn_results.txt
              if ! git diff --staged --quiet; then
                git commit -m "Auto-update turn_results.txt (${CUR_DATE}) [skip ci]"
                git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push origin "HEAD:${CUR_BRANCH}"
              fi
            fi
          else
            echo "[*] 结果无变动，无需提交。"
          fi
          cd ..
          rm -rf target_repo

      - name: Clean artifacts and old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          echo "[*] 立即销毁本次分片产物与历史运行记录..."
          TARGET_REPO="${GITHUB_REPOSITORY}"

          # 使用 actions:write 权限的 GITHUB_TOKEN 删除本次所有分片 Artifacts
          gh api --paginate "repos/${TARGET_REPO}/actions/runs/${CURRENT_RUN_ID}/artifacts" --jq '.artifacts[].id' 2>/dev/null | while read -r aid; do
            if [ -n "$aid" ]; then
              gh api -X DELETE "repos/${TARGET_REPO}/actions/artifacts/${aid}" >/dev/null 2>&1 || true
            fi
          done

          # 清理历史运行记录
          gh run list --repo "$TARGET_REPO" --limit 100 --json databaseId --jq ".[] | select(.databaseId != ${CURRENT_RUN_ID}) | .databaseId" 2>/dev/null | while read -r id; do
            if [ -n "$id" ]; then
              gh run delete --repo "$TARGET_REPO" "$id" >/dev/null 2>&1 || true
            fi
          done
          echo "[+] 清理完成！"
